name: Python CI

# Trigger the workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Strategy matrix to test against multiple Python versions simultaneously
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    # Step 1: Check out the repository code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Set up the specific Python runtime version
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Automatically caches dependencies to speed up future runs

    # Step 3: Upgrade pip and install standard development tools
    - name: Install baseline dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest

    # Step 4: Install application-specific requirements if they exist
    - name: Install project dependencies
      if: hashFiles('requirements.txt') != ''
      run: |
        pip install -r requirements.txt

    # Step 5: Lint code to catch formatting errors and bugs early
    - name: Lint and format check with Ruff
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        ruff check . --output-format=github

    # Step 6: Execute tests using pytest
    - name: Run test suite with pytest
      run: |
        pytest -v


