name: Frontend CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify staging smoke refuses production database targets
        shell: bash
        run: |
          set -euo pipefail
          assert_target_is_blocked() {
            local project_ref="$1"
            local output
            if output="$(env \
              STAGING_SUPABASE_PROJECT_REF="$project_ref" \
              STAGING_SUPABASE_URL="https://${project_ref}.supabase.co" \
              STAGING_SUPABASE_ANON_KEY="dummy-public-key" \
              STAGING_TEST_USER_EMAIL="tester@example.invalid" \
              STAGING_TEST_USER_PASSWORD="not-used" \
              STAGING_EXPECTED_USER_ID="f6f90bd4-7c48-4406-88da-043126b8d016" \
              STAGING_WORKSPACE_ID="31f8d2fd-ea50-44ab-b269-cf2f72fd1b69" \
              STAGING_TASK_ID="2b0f97d8-3aaf-432a-ad02-f30cee5bb0f1" \
              node scripts/staging-e2e-smoke.mjs 2>&1)"; then
              echo "::error::Staging smoke unexpectedly accepted forbidden project ref ${project_ref}."
              return 1
            fi
            printf '%s\n' "$output" | grep -F "Refusing to run: Main DB production and Invoice DB are forbidden smoke-test targets."
          }
          assert_target_is_blocked "nhvmeahmwywhaxtnuehr"
          assert_target_is_blocked "tlhznghnfdwpilhfjyyu"

      - name: Offline planner evaluation
        run: npm run evaluate:planner

      - name: Build
        run: npm run build

      - name: Check and test the Edge Function
        run: |
          deno check --allow-import=cdn.sheetjs.com:443 --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/execute-tool/index.ts
          deno test --allow-import=cdn.sheetjs.com:443 --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/execute-tool/handler_test.ts
          deno test --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/execute-tool/invoiceProvider_test.ts
          deno run --allow-import=cdn.sheetjs.com --allow-net=cdn.sheetjs.com --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/execute-tool/xlsxReader_smoke.ts
          deno check --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/plan-workflow/index.ts
          deno test --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/plan-workflow/handler_test.ts
          deno check --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/google-workspace/index.ts
          deno test --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/google-workspace/provider_test.ts
          deno test --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/google-workspace/handler_test.ts
          deno check --allow-import=cdn.sheetjs.com:443 --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/advance-plan-run/index.ts
          deno test --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/advance-plan-run/handler_test.ts
          deno check --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/finnlp-integration/index.ts
          deno test --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/finnlp-integration/handler_test.ts
          deno test --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/execute-tool/finnlpProvider_test.ts
          deno test --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/execute-tool/finnlpReviewProvider_test.ts
          deno test --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/_shared/observability_test.ts

      # The deployment workflow uses Supabase's API bundler, which rejects sloppy extensionless imports.
      # Check the deployable function entry points without --unstable-sloppy-imports so CI mirrors that constraint.
      - name: Verify strict Deno module resolution for deployable Edge Functions
        run: |
          deno check --allow-import=cdn.sheetjs.com:443 --node-modules-dir=auto supabase/functions/execute-tool/index.ts
          deno check --node-modules-dir=auto supabase/functions/plan-workflow/index.ts
          deno check --allow-import=cdn.sheetjs.com:443 --node-modules-dir=auto supabase/functions/advance-plan-run/index.ts
          deno check --node-modules-dir=auto supabase/functions/finnlp-integration/index.ts

      - name: Enforce explicit extensions in deployed Edge Function import graphs
        run: node scripts/check-deno-import-extensions.mjs

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.121.0

      - name: Start local Supabase
        timeout-minutes: 10
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 420s supabase start -x studio,mailpit,storage-api,realtime,edge-runtime,logflare,vector
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Supabase startup failed or exceeded the 7-minute startup deadline (exit $status)."
            docker ps -a
            for container in $(docker ps -aq); do
              echo "Recent logs for container $container"
              docker logs --tail 100 "$container" 2>&1 || true
            done
            exit "$status"
          fi

      - name: Lint local database schema
        run: supabase db lint --local

      - name: Test database migrations and RLS
        run: supabase test db

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: flowwork-frontend:ci
          secrets: |
            VITE_SUPABASE_URL=https://example.supabase.co
            VITE_SUPABASE_ANON_KEY=ci-placeholder-public-anon-key

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flowwork-frontend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
