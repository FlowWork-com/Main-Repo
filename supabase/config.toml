project_id = "flowwork"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[studio]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[functions.execute-tool]
verify_jwt = true

[functions.plan-workflow]
verify_jwt = true

[realtime]
enabled = false

[experimental]
stack = true
