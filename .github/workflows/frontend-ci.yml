name: Frontend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check and test the Edge Function
        run: |
          deno check --allow-import=cdn.sheetjs.com:443 --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/execute-tool/index.ts
          deno test --allow-import=cdn.sheetjs.com:443 --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/execute-tool/handler_test.ts
          deno run --allow-import=cdn.sheetjs.com:443 --allow-net=cdn.sheetjs.com:443 --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/execute-tool/xlsxReader_smoke.ts
          deno check --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/plan-workflow/index.ts
          deno test --node-modules-dir=auto --unstable-sloppy-imports supabase/functions/plan-workflow/handler_test.ts

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      - name: Start local Supabase
        run: supabase start -x studio,mailpit,storage-api,realtime,edge-runtime,logflare,vector

      - name: Lint local database schema
        run: supabase db lint --local

      - name: Test database migrations and RLS
        run: supabase test db

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: flowwork-frontend:ci
          secrets: |
            VITE_SUPABASE_URL=https://example.supabase.co
            VITE_SUPABASE_ANON_KEY=ci-placeholder-public-anon-key

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: flowwork-frontend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
